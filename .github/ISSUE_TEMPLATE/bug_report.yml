name: Bug report
description: Something on the site is broken or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page
      placeholder: e.g. /calendar or /events/weekly-contest-1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Android, Safari on macOS, light/dark mode
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
